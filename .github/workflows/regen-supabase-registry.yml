name: regen-supabase-registry

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily (~13:00 ICT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regen-supabase-registry
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install postgresql-client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Regenerate REGISTRY_SUPABASE.md
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL repo secret is not set. Configure it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          ./scripts/regen_registry_supabase.sh

      - name: Commit registry if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements/REGISTRY_SUPABASE.md
          if git diff --cached --quiet; then
            echo "No registry changes; skipping commit."
          else
            git commit -m "chore(registry): regenerate REGISTRY_SUPABASE.md"
            git push
          fi
