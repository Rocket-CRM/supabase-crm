<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sunsu · Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #111318;
      --muted: #6b6670;
      --line: #ece7df;
      --paper: #f7f4ef;
      --cream: #ffffff;
      --chili: #ff2a1f;
      --chili-deep: #c4160e;
      --mango: #ffb800;
      --gold: #ffc53d;
      --cyan: #3ecfff;
      --lime: #b8f000;
      --magenta: #ff2d9b;
      --grape: #5b3df5;
      --shadow: 0 10px 28px rgba(17, 19, 24, 0.08);
      --phone-w: 360px;
      --phone-h: 760px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
    img { display: block; max-width: 100%; }

    body {
      font-family: "Noto Sans Thai", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(62, 207, 255, 0.18), transparent 45%),
        radial-gradient(ellipse at 90% 10%, rgba(255, 45, 155, 0.14), transparent 40%),
        radial-gradient(ellipse at 50% 100%, rgba(184, 240, 0, 0.16), transparent 45%),
        #f0ece4;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      padding: 36px 20px 56px;
      max-width: 520px;
      margin: 0 auto;
    }

    .page-head {
      margin-bottom: 20px;
      text-align: center;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 8px 14px 8px 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .brand-pill img {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .brand-pill em {
      font-style: normal;
      color: var(--lime);
      font-weight: 800;
    }

    .page-head h1 {
      margin-top: 14px;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .page-head p {
      margin-top: 6px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
    }

    .phone {
      width: min(100%, var(--phone-w));
      height: var(--phone-h);
      margin: 0 auto;
      background: var(--paper);
      border-radius: 40px;
      box-shadow:
        0 0 0 9px #111,
        0 0 0 11px #2a2a2a,
        0 28px 56px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .notch {
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      width: 104px; height: 24px;
      background: #111;
      border-radius: 16px;
      z-index: 40;
      pointer-events: none;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: #faf8f5;
    }

    .scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 78px;
      scrollbar-width: none;
    }
    .scroll::-webkit-scrollbar { display: none; }

    /* —— HERO —— */
    .hero {
      position: relative;
      padding: 46px 18px 52px;
      color: #fff;
      overflow: hidden;
      background:
        radial-gradient(circle at 85% 20%, rgba(255, 197, 61, 0.35), transparent 28%),
        radial-gradient(circle at 15% 70%, rgba(62, 207, 255, 0.28), transparent 32%),
        linear-gradient(155deg, #1a1a1c 0%, #2a1524 42%, #111318 100%);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: -40% -20%;
      background: conic-gradient(
        from 140deg,
        rgba(62, 207, 255, 0.35),
        rgba(184, 240, 0, 0.22),
        rgba(255, 197, 61, 0.28),
        rgba(255, 45, 155, 0.32),
        rgba(62, 207, 255, 0.35)
      );
      filter: blur(40px);
      opacity: 0.55;
      animation: hue-drift 12s linear infinite;
      pointer-events: none;
    }

    @keyframes hue-drift {
      to { transform: rotate(360deg); }
    }

    .hero-wave {
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 28px;
      background: #faf8f5;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      z-index: 5;
    }

    .topbar {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .greet {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .greet img {
      width: 38px; height: 38px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.35);
      flex-shrink: 0;
    }
    .greet strong {
      display: block;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .greet span {
      font-size: 11px;
      color: rgba(255,255,255,0.62);
      font-weight: 500;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .lang {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      display: grid;
      place-items: center;
    }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--cyan), var(--magenta));
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.28);
    }

    .hero-body {
      position: relative;
      z-index: 3;
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 8px;
      align-items: end;
      min-height: 132px;
    }

    .hero-copy h2 {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
      max-width: 9ch;
    }
    .hero-copy h2 em {
      font-style: normal;
      background: linear-gradient(90deg, var(--lime), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-pill {
      display: inline-flex;
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 42, 31, 0.55);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.3;
      max-width: 18ch;
    }

    .hero-art {
      position: relative;
      height: 140px;
    }
    .hero-art .pack {
      position: absolute;
      right: -6px; bottom: -4px;
      width: 118px;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,0.35));
      animation: float-y 3.6s ease-in-out infinite;
    }
    .hero-art .fruit {
      position: absolute;
      width: 54px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.25));
      animation: float-y 2.8s ease-in-out infinite;
    }
    .hero-art .fruit.a { left: -4px; top: 8px; animation-delay: -0.6s; }
    .hero-art .fruit.b { right: 72px; top: -2px; width: 42px; animation-delay: -1.4s; }

    .coin {
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe9a0, var(--gold) 55%, #d49200);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15), 0 4px 8px rgba(0,0,0,0.2);
      animation: float-y 2.4s ease-in-out infinite;
    }
    .coin.c1 { left: 8px; bottom: 28px; animation-delay: -0.2s; }
    .coin.c2 { right: 18px; top: 18px; width: 12px; height: 12px; animation-delay: -1s; }
    .coin.c3 { right: 54px; bottom: 18px; width: 14px; height: 14px; animation-delay: -1.8s; }

    @keyframes float-y {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .dots {
      position: absolute;
      left: 18px; bottom: 36px;
      z-index: 6;
      display: flex;
      gap: 5px;
    }
    .dots i {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      display: block;
    }
    .dots i.on {
      width: 16px;
      border-radius: 999px;
      background: var(--lime);
    }

    /* —— BODY —— */
    .body {
      padding: 4px 16px 20px;
      position: relative;
      z-index: 2;
    }

    .tier-progress {
      display: flex;
      justify-content: center;
      margin-top: -10px;
      margin-bottom: 12px;
      position: relative;
      z-index: 8;
    }
    .tier-progress button {
      background: var(--cream);
      border: 1.5px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink);
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tier-progress button svg {
      width: 12px; height: 12px;
      stroke: var(--chili);
      fill: none;
      stroke-width: 2;
    }

    .status-row {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 10px;
      align-items: stretch;
    }

    .points-block {
      padding: 4px 2px 2px;
    }
    .tier-label {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #c9a227, #f0d060, #a67c00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.1;
    }
    .points-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 2px;
    }
    .points-line .num {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .star {
      width: 18px; height: 18px;
      color: var(--gold);
      flex-shrink: 0;
      transform: translateY(2px);
    }
    .points-meta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.35;
    }
    .member-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink);
    }
    .member-tag svg {
      width: 13px; height: 13px;
      stroke: var(--grape);
      fill: none;
      stroke-width: 1.8;
    }

    .offer-card {
      background: var(--cream);
      border-radius: 18px;
      padding: 12px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(17,19,24,0.04);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .offer-card .thumb {
      width: 44px; height: 44px;
      border-radius: 12px;
      object-fit: contain;
      background: linear-gradient(160deg, #fff0e8, #e8f9ff);
      padding: 4px;
    }
    .offer-card h3 {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .offer-card p {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.35;
      font-weight: 500;
    }
    .offer-card .cta {
      margin-top: 4px;
      background: var(--chili);
      color: #fff;
      border-radius: 12px;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 6px 14px rgba(255, 42, 31, 0.28);
      transition: transform 0.12s ease;
    }
    .offer-card .cta:active { transform: scale(0.97); }
    .offer-card .cta svg {
      width: 12px; height: 12px;
      fill: var(--gold);
      stroke: none;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .feature-card {
      background: var(--cream);
      border-radius: 18px;
      padding: 14px 12px 12px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(17,19,24,0.04);
      min-height: 148px;
      position: relative;
      overflow: hidden;
      text-align: left;
      transition: transform 0.15s ease;
    }
    .feature-card:active { transform: scale(0.98); }
    .feature-card h3 {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .feature-card p {
      margin-top: 4px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.35;
      max-width: 14ch;
      font-weight: 500;
    }
    .feature-card .art {
      position: absolute;
      right: -4px; bottom: -6px;
      width: 78px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.12));
      pointer-events: none;
    }
    .feature-card.claim {
      background:
        radial-gradient(circle at 90% 90%, rgba(255, 197, 61, 0.18), transparent 45%),
        var(--cream);
    }
    .feature-card.mission {
      background:
        radial-gradient(circle at 90% 90%, rgba(62, 207, 255, 0.18), transparent 45%),
        var(--cream);
    }

    .quick-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-top: 18px;
      padding: 0 2px;
    }
    .quick {
      display: grid;
      place-items: center;
      gap: 7px;
      text-align: center;
    }
    .quick .ico {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 6px 16px rgba(17,19,24,0.07);
      border: 1px solid rgba(17,19,24,0.04);
      transition: transform 0.12s ease;
    }
    .quick:active .ico { transform: scale(0.94); }
    .quick .ico svg {
      width: 22px; height: 22px;
      stroke: var(--chili);
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .quick:nth-child(2) .ico svg { stroke: var(--magenta); }
    .quick:nth-child(3) .ico svg { stroke: var(--grape); }
    .quick:nth-child(4) .ico svg { stroke: #1a8f6e; }
    .quick:nth-child(5) .ico svg { stroke: #2f6fed; }
    .quick span {
      font-size: 9px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.25;
      max-width: 6.5ch;
    }

    /* —— NAV —— */
    .nav {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 70px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 20;
      padding: 6px 4px 12px;
    }
    .nav .item {
      display: grid;
      place-items: center;
      gap: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }
    .nav .item.active { color: var(--chili); }
    .nav .item.active .ico {
      background: linear-gradient(145deg, var(--chili), var(--magenta));
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 42, 31, 0.28);
    }
    .nav .ico {
      width: 32px; height: 32px;
      border-radius: 11px;
      display: grid;
      place-items: center;
    }
    .nav svg {
      width: 18px; height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav .item.active svg { stroke: #fff; }

    @media (max-width: 420px) {
      .page { padding: 16px 0 24px; }
      .page-head { padding: 0 16px; }
      .phone {
        width: 100%;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
      .notch { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-head">
      <div class="brand-pill">

        <span>sunsu <em>home</em></span>

    <div class="phone" aria-label="Sunsu home screen">

      <div class="screen">

          <div class="body">
            <div class="tier-progress">
              <button type="button">

            <div class="status-row">

              <article class="offer-card">

                  <svg viewBox="0 0 24 24"><path d="M12 2.5l2.7 6.2 6.8.6-5.1 4.5 1.5 6.6L12 16.8 6.1 20.4l1.5-6.6L2.5 9.3l6.8-.6L12 2.5z"/></svg>
                </button>
              </article>
            </div>

            <div class="feature-grid">
              <button class="feature-card claim" type="button">
                <h3>Claim point</h3>
                <p>สแกนหรืออัปโหลดใบเสร็จเพื่อรับแต้ม</p>
                <img class="art" src="fruits.png" alt="" />
              </button>
              <button class="feature-card mission" type="button">
                <h3>Mission</h3>
                <p>ทำภารกิจปลดล็อกของรางวัลพิเศษ</p>
                <img class="art" src="grapes.png" alt="" />
              </button>
            </div>

            <div class="quick-row">
              <button class="quick" type="button">
                <span class="ico" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><path d="M13 17h3v3M17 13v3h3"/></svg>
                </span>

              <button class="quick" type="button">
                <span class="ico" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8 13h8M8 17h5"/></svg>
